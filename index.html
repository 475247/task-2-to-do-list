<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Web App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>To-Do List</h1>

        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task">

            <button id="addTaskBtn">
                Add Task
            </button>

        </div>

        <div class="task-section">

            <h2>
                Pending Tasks
                (<span id="pendingCount">0</span>)
            </h2>

            <p id="pendingEmpty">
                No Pending Tasks
            </p>

            <ul id="pendingList">

            </ul>

        </div>

        <div class="task-section">

            <h2>
                Completed Tasks
                (<span id="completedCount">0</span>)
            </h2>

            <p id="completedEmpty">
                No Completed Tasks
            </p>

            <ul id="completedList">

            </ul>

        </div>

    </div>

<script src="script.js"></script>

</body>
</html>
